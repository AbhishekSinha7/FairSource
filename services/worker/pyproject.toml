[project]
name = "fairsource-worker"
version = "0.2.0"
description = "FairSource processing worker: OCR, clean, language check, dedup, safety, chunk, embed"
requires-python = ">=3.12"
dependencies = [
  "functions-framework>=3.8",
  "google-cloud-firestore>=2.19",
  "google-cloud-pubsub>=2.27",
  "google-cloud-storage>=2.19",
  "google-genai>=1.0",
  "pydantic>=2.10",
  "pypdf>=5.0",
  "trafilatura>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
