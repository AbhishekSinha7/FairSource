# Builds one container image and pushes it to Artifact Registry. Used by infra/deploy.sh:
#   gcloud builds submit . --config infra/build-image.yaml \
#     --substitutions=^@^_DOCKERFILE=services/Dockerfile.node@_IMAGE=...@_BUILD_ARGS=--build-arg SERVICE=api
substitutions:
  _DOCKERFILE: services/Dockerfile.node
  _IMAGE: ''
  _BUILD_ARGS: ''
steps:
  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    # Also tagged :latest, so `SKIP_BUILD=1 bash infra/deploy.sh` can redeploy without rebuilding.
    # Cloud Build substitutes $_IMAGE into the text; $$ passes a literal $ to bash for IMG.
    args: ['-c', 'IMG="$_IMAGE"; docker build -f "$_DOCKERFILE" $_BUILD_ARGS -t "$$IMG" -t "$${IMG%:*}:latest" . && docker push "$${IMG%:*}:latest"']
images: ['$_IMAGE']
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
timeout: 1800s
